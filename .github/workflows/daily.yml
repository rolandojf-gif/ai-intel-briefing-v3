name: Gemini EOD + RSS daily for NEXUS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Dos intentos: GitHub retrasa las tareas en hora en punto (la de las 05:00
  # arrancaba hacia las 12:30). La segunda no hace nada si la primera ya
  # publico la edicion del dia (ver already_published en src/newtab_daily.py).
  schedule:
    - cron: "37 4 * * *"
      timezone: "Europe/Madrid"
    - cron: "37 6 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      force_gemini:
        description: "Manual run: Gemini full (true) or RSS-only (false)"
        type: boolean
        default: true
      force_refresh:
        description: "Ignore daily Gemini cache/done files"
        type: boolean
        default: false
      from_scheduler:
        description: "Lanzado por el programador de Netlify (se comporta como programado)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run extension tests
        run: node --test extension/tests/*.test.mjs netlify/lib/*.test.mjs

  generate:
    needs: test
    # Una sola generacion a la vez: el 2026-11-15 la programada y una manual
    # coincidieron, las dos escribieron la edicion y la segunda no pudo subir.
    concurrency:
      group: generate-edition
      cancel-in-progress: false
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Gemini/RSS edition
        env:
          FORCE_GEMINI: ${{ (github.event_name != 'workflow_dispatch' || inputs.force_gemini != false) && '1' || '0' }}
          FORCE_GEMINI_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh && '1' || '0' }}
          FROM_SCHEDULER: ${{ github.event_name == 'workflow_dispatch' && inputs.from_scheduler && '1' || '0' }}
        run: |
          python -m src.newtab_daily

      - name: Commit and push docs
        run: |
          git config user.name "ai-intel-bot"
          git config user.email "ai-intel-bot@users.noreply.github.com"
          DATE=$(python -c "from src.config import radar_today_str; print(radar_today_str())")
          git add docs/index.html docs/weekly.html docs/archivo.html docs/search.json docs/sitemap.xml docs/robots.txt
          git add docs/newtab/*.json 2>/dev/null || true
          git add docs/d 2>/dev/null || true
          if [ -f "docs/data/${DATE}.json" ]; then
            git add "docs/data/${DATE}.json"
          fi
          git restore --staged -- \
            docs/data/*.llm_cache.json \
            docs/data/*.llm_done \
            docs/data/*.x_cache.json \
            docs/data/image_cache.json 2>/dev/null || true
          git commit -m "Daily briefing" || echo "No changes"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://aievolve.netlify.app
        run: python -m src.notify

      # Va el ULTIMO: la edicion ya esta publicada. Si el dia sale degradado,
      # el job acaba en rojo y GitHub avisa por email, en vez de seguir en verde
      # como del 7 al 13 de noviembre.
      - name: Health check
        run: python -m src.health_check
