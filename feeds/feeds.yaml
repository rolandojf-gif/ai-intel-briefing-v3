# AI Strategic Radar — source portfolio
#
# Filosofía: amplitud de cobertura y máxima diversidad. El gate de relevancia
# (LLM Gemini) evalúa la señal real eliminando el ruido y seleccionando las
# noticias más actuales y de mayor impacto sobre LLMs, frontera, agentes,
# semiconductores y negocio de IA.
#
# `cap: 1` garantiza que ninguna fuente cope el radar y la portada sea diversa.

