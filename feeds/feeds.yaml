# AI Strategic Radar — source portfolio
#
# Caps asimétricos: los labs y SemiAnalysis pueden meter 2–3 items el mismo día
# (un launch + un follow-up es señal, no monopolio). Generalistas y blogs de
# análisis se quedan en 1 para que Reuters no desplace a Anthropic. El lote del
# LLM cubre la suma de caps (ver LLM_BATCH_SIZE): si subes un cap, sube el lote.
#
# El gate de Gemini decide qué sobrevive. El cap solo limita cuántos candidatos
# aporta cada fuente, no qué se publica.

