  # ── Señal de comunidad ────────────────────────────────────────────────────
  # Modalidad distinta al resto: en vez de fuentes editoriales, lo que la
  # comunidad técnica vota masivamente. Detecta cosas antes del ciclo de
  # noticias. Umbral alto (150 puntos) y cap 1 para que no meta ruido.
  - name: Hacker News (alto voltaje)
    type: rss
    url: https://hnrss.org/newest?q=AI+OR+LLM+OR+OpenAI+OR+Anthropic&points=150
    limit: 10
    cap: 1
    tags: [community, signal]
