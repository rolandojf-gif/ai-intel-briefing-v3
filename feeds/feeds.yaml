# AI Strategic Radar — source portfolio
#
# Filosofía: pocas fuentes, alta densidad de señal. El gate de relevancia
# (src/llm_rank.py) elimina lo que no mueve la carrera AGI, así que aquí
# priorizamos FUENTES PRIMARIAS (labs) y ANÁLISIS INDEPENDIENTE, no agregadores.
#
# `cap` = máximo de items por fuente y día. Mantenerlos bajos es deliberado:
# obliga a que cada fuente compita por sus mejores piezas.
#
# Todas las URLs están verificadas contra la red real (workflow Probe feeds,
# 2026-08-22). Dos aprendizajes que conviene recordar al añadir fuentes:
#   - Los feeds *.substack.com devuelven 403 desde los runners de GitHub, pero
#     los Substack con dominio propio funcionan (Interconnects, Latent Space).
#   - Varios labs no publican RSS: Anthropic, Meta AI y Epoch AI no tienen feed
#     oficial. Antes de configurar una fuente, comprobar que existe de verdad.
#
# NOTA: las fuentes X/Twitter se eliminaron en 2026-08. Los mirrors públicos
# (xcancel, nitter) llevan meses caídos y devolvían 0 items desde hace 14+ días,
# consumiendo timeout en cada run. Los labs publican lo relevante en RSS oficial,
# que además llega limpio (el scraping devolvía tweets mezclados y markdown roto).

sources:
  # ── Frontier labs: fuentes primarias ──────────────────────────────────────
  - name: OpenAI
    type: rss
    url: https://openai.com/news/rss.xml
    limit: 8
    cap: 2
    tags: [labs, models, frontier]

  # Anthropic no publica RSS oficial (verificado: news, engineering y feed.xml
  # dan 404). Este mirror comunitario es la única vía con contenido fresco. Es
  # una dependencia de un tercero: si deja de actualizarse, el health-check la
  # marcará como muerta en el pie del radar.
  - name: Anthropic
    type: rss
    url: https://tim-hilde.github.io/anthropic-rss/rss.xml
    limit: 8
    cap: 2
    tags: [labs, models, frontier]

  - name: DeepMind Blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    limit: 8
    cap: 2
    tags: [labs, models, frontier]

  - name: Mistral
    type: rss
    url: https://mistral.ai/rss.xml
    limit: 6
    cap: 1
    tags: [labs, models, open_weights]

  - name: Google AI Blog
    type: rss
    url: https://blog.google/technology/ai/rss/
    limit: 6
    cap: 1
    tags: [labs, models]

  # ── China stack ───────────────────────────────────────────────────────────
  - name: Qwen (Alibaba)
    type: rss
    url: https://qwenlm.github.io/blog/index.xml
    limit: 6
    cap: 2
    tags: [china, models, open_weights]

  # Solo dispara cuando hay release real; el resto de días queda fuera por el
  # filtro de antigüedad, que es el comportamiento deseado.
  - name: DeepSeek Releases
    type: rss
    url: https://github.com/deepseek-ai/DeepSeek-V3/releases.atom
    limit: 5
    cap: 1
    tags: [china, models, open_weights]

  - name: ChinaTalk
    type: rss
    url: https://www.chinatalk.media/feed
    limit: 6
    cap: 1
    tags: [china, geopol, analysis]

  # ── Economía de modelos: comparativas reales de coste y capacidad ─────────
  # Together publica benchmarks cruzados entre modelos frontera occidentales y
  # chinos con coste y routing. Cubre a la vez capacidad frontier, economía de
  # modelos y stack chino, que es donde el radar se quedaba corto.
  - name: Together AI
    type: rss
    url: https://www.together.ai/blog/rss.xml
    limit: 8
    cap: 2
    tags: [models, economics, benchmarks, china]

  # ── Análisis independiente: compute, chips, economía de modelos ───────────
  - name: SemiAnalysis
    type: rss
    url: https://semianalysis.com/feed/
    limit: 6
    cap: 2
    tags: [compute, chips, analysis, economics]

  - name: SemiWiki
    type: rss
    url: https://semiwiki.com/feed/
    limit: 8
    cap: 2
    tags: [infra, chips]

  - name: NVIDIA Blog (AI)
    type: rss
    url: https://blogs.nvidia.com/blog/category/deep-learning/feed/
    limit: 6
    cap: 1
    tags: [infra, chips]

  # Semis con lente financiera: capex, ciclos y timelines. Complementa a
  # SemiAnalysis, que es más técnico.
  - name: Fabricated Knowledge
    type: rss
    url: https://www.fabricatedknowledge.com/feed
    limit: 5
    cap: 1
    tags: [chips, economics, analysis]

  # ── Poder de mercado ──────────────────────────────────────────────────────
  # Ben Thompson analiza desplazamientos de poder entre plataformas, que es
  # exactamente el ángulo de "quién gana y quién pierde". Parcialmente de pago:
  # el RSS trae el artículo semanal gratuito y extractos del resto.
  - name: Stratechery
    type: rss
    url: https://stratechery.com/feed/
    limit: 5
    cap: 1
    tags: [market_power, economics, analysis]

