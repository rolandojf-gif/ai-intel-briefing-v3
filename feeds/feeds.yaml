    tags: [analysis, engineering, agents]

  # ── Agents / coding agents / MCP ──────────────────────────────────────────
  - name: Simon Willison (AI & LLMs)
    type: rss
    url: https://simonwillison.net/atom/everything/
    limit: 10
    cap: 1
    tags: [agents, mcp, coding, tools]

  - name: Hugging Face Blog
    type: rss
