[build]
  publish = "docs"

# Programador de la edicion diaria (ver netlify/functions/daily-edition.mjs).
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
